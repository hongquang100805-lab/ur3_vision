# All positions below are base_link; object/destination positions are cube centres.
server_timeout_s: 30.0
service_timeout_s: 8.0
ik_timeout_s: 2
continuity:
  maximum_ik_delta_rad: 3.141592653589793
  maximum_trajectory_delta_rad: 0.5
  execution_start_tolerance_rad: 0.03
  joint_limit_margin_rad: 0.05
  maximum_equivalent_candidates: 64
  maximum_home_candidates: 8
  repeat_branch_tolerance_rad: 0.02
cartesian_step_m: 0.005
collision_diagnostic_step_m: 0.002
# HOME only: GetMotionPlan, explicit simulated camera-retreat start, no execution.
home_precheck:
  planning_time_s: 15.0
  planning_attempts: 3
  joint_tolerance_rad: 0.01
  start_tolerance_rad: 0.0001
precheck_scene_drift_m: 0.01
place_release_clearance_m: 0.005
place_approach_clearance_m: 0.015
zone_offset_margin_m: 0.005
# Virtual joint seed ONLY; never commands the gripper during precheck.
# Matches simple_parallel_gripper.urdf.xacro: right joint opens at +0.043.
# Nominal contact with a centred 40 mm cube: left=0.024, right=0.019.
precheck_gripper:
  open: {simple_gripper_left_finger_joint: 0.0, simple_gripper_right_finger_joint: 0.043}
  holding: {simple_gripper_left_finger_joint: 0.024, simple_gripper_right_finger_joint: 0.019}
# Leave the tabletop ROI after vertical retreat so the overhead camera sees blocks.
camera_retreat: {frame_id: base_link, x: 0.18, y: -0.20, z: 0.45}
verification:
  timeout_s: 20.0
  minimum_frames: 3
  position_tolerance_m: 0.02
  z_tolerance_m: 0.012
